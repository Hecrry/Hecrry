<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Hoja de hechicero de Hery: grado 3 y atributos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1f"/>
      <stop offset="1" stop-color="#171040"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.6" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .sans { font-family: 'Impact', 'Trebuchet MS', 'Segoe UI', sans-serif; }
    .jp   { font-family: 'Yu Gothic', 'Noto Sans CJK JP', 'MS Gothic', sans-serif; }
    .fill { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.6s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .ring  { transform-box: fill-box; transform-origin: center; animation: spin 16s linear infinite; }
    .ringr { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: .8; } }
    .blink { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="900" height="400" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#3b82f6" stroke-opacity=".55" stroke-width="2"/>

  <!-- Barra superior -->
  <text class="mono" x="30" y="38" font-size="15" font-weight="700" letter-spacing="3" fill="#60a5fa">▌HOJA DE HECHICERO</text>
  <text class="mono" x="870" y="38" text-anchor="end" font-size="13" letter-spacing="2" fill="#6b7280">ARCHIVO 01</text>
  <line x1="30" y1="52" x2="870" y2="52" stroke="#7c3aed" stroke-opacity=".5"/>

  <!-- Panel izquierdo: sello -->
  <g transform="translate(165,118)">
    <circle r="54" fill="#7c3aed" opacity=".5" filter="url(#glow)" class="pulse"/>
    <circle class="ring"  r="52" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 9"/>
    <circle class="ringr" r="42" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="18 10"/>
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#0b0a1f" stroke="#a78bfa" stroke-width="2.5"/>
    <text class="sans" x="0" y="13" text-anchor="middle" font-size="36" fill="#ffffff">H</text>
  </g>

  <text class="sans" x="165" y="204" text-anchor="middle" font-size="28" letter-spacing="7" fill="#e6edf3">HERY</text>
  <text class="mono" x="165" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#22c55e">GRADO 3 · PUPIL</text>
  <text class="mono" x="165" y="248" text-anchor="middle" font-size="11" fill="#93c5fd">PROGRAMADOR COMPETITIVO</text>
  <text class="mono" x="165" y="264" text-anchor="middle" font-size="11" fill="#93c5fd">+ TUTOR DE MATES Y FISICA</text>

  <!-- Energia -->
  <text class="mono" x="30" y="298" font-size="11" fill="#a78bfa">ENERGIA → GRADO 2</text>
  <rect x="30" y="306" width="270" height="12" rx="6" fill="#1b1648"/>
  <rect class="fill" x="30" y="306" width="110" height="12" rx="6" fill="url(#xp)" style="animation-delay:.2s"/>
  <text class="mono" x="30" y="340" font-size="11" fill="#6b7280">(se recarga con cafe)</text>

  <line x1="330" y1="72" x2="330" y2="350" stroke="#7c3aed" stroke-opacity=".35"/>

  <!-- Atributos -->
  <g class="mono" font-size="13" fill="#e6edf3" font-weight="700">
    <text x="360" y="100">ALGORITMOS</text>
    <text x="360" y="144">ESTRUCTURAS DE DATOS</text>
    <text x="360" y="188">MATEMATICAS</text>
    <text x="360" y="232">GEOMETRIA</text>
    <text x="360" y="276">ENSEÑAR</text>
    <text x="360" y="320">CONSTANCIA</text>
  </g>

  <g fill="#1b1648">
    <rect x="560" y="89"  width="250" height="14" rx="7"/>
    <rect x="560" y="133" width="250" height="14" rx="7"/>
    <rect x="560" y="177" width="250" height="14" rx="7"/>
    <rect x="560" y="221" width="250" height="14" rx="7"/>
    <rect x="560" y="265" width="250" height="14" rx="7"/>
    <rect x="560" y="309" width="250" height="14" rx="7"/>
  </g>

  <g fill="url(#bar)">
    <rect class="fill" x="560" y="89"  width="137.5" height="14" rx="7" style="animation-delay:.3s"/>
    <rect class="fill" x="560" y="133" width="125"   height="14" rx="7" style="animation-delay:.5s"/>
    <rect class="fill" x="560" y="177" width="175"   height="14" rx="7" style="animation-delay:.7s"/>
    <rect class="fill" x="560" y="221" width="112.5" height="14" rx="7" style="animation-delay:.9s"/>
    <rect class="fill" x="560" y="265" width="212.5" height="14" rx="7" style="animation-delay:1.1s"/>
    <rect class="fill" x="560" y="309" width="187.5" height="14" rx="7" style="animation-delay:1.3s"/>
  </g>

  <g class="mono" font-size="13" fill="#fbbf24" font-weight="700">
    <text x="826" y="101">55</text>
    <text x="826" y="145">50</text>
    <text x="826" y="189">70</text>
    <text x="826" y="233">45</text>
    <text x="826" y="277">85</text>
    <text x="826" y="321">75</text>
  </g>

  <text class="mono" x="450" y="382" text-anchor="middle" font-size="12" letter-spacing="2" fill="#e11d48">TECNICA INNATA: explicar cosas dificiles de forma facil<tspan class="blink"> ▮</tspan></text>
</svg>
