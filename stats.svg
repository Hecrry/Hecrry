<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" role="img" aria-label="Character sheet de Hery: nivel Pupil y estadisticas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0a24"/>
      <stop offset="1" stop-color="#1c0d3d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29e7ff"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .sans { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
    .fill { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.6s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .85; } }
    .blink { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="900" height="380" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="378" rx="13" fill="none" stroke="#29e7ff" stroke-opacity=".5" stroke-width="2"/>

  <!-- Barra superior -->
  <text class="mono" x="30" y="38" font-size="15" font-weight="700" letter-spacing="3" fill="#29e7ff">▌CHARACTER SHEET</text>
  <text class="mono" x="870" y="38" text-anchor="end" font-size="13" letter-spacing="2" fill="#7d8590">SAVE FILE 01</text>
  <line x1="30" y1="52" x2="870" y2="52" stroke="#a855f7" stroke-opacity=".5"/>

  <!-- Avatar -->
  <g transform="translate(110,135)">
    <circle r="52" fill="#a855f7" opacity=".5" filter="url(#glow)" class="pulse"/>
    <circle class="ring" r="50" fill="none" stroke="#29e7ff" stroke-width="2" stroke-dasharray="6 8"/>
    <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="#0f0a24" stroke="#ff4fa3" stroke-width="3"/>
    <text class="sans" x="0" y="15" text-anchor="middle" font-size="44" font-weight="900" fill="#ffd166">H</text>
  </g>

  <!-- Datos del personaje -->
  <text class="sans" x="200" y="108" font-size="30" font-weight="900" letter-spacing="4" fill="#e6edf3">HERY</text>
  <text class="mono" x="200" y="132" font-size="13" fill="#29e7ff">CLASE: Programador Competitivo</text>
  <text class="mono" x="200" y="150" font-size="13" fill="#29e7ff">SUBCLASE: Tutor / Mago de las Mates</text>
  <text class="mono" x="200" y="172" font-size="13" fill="#3fb950" font-weight="700">NIVEL: PUPIL</text>

  <!-- XP -->
  <text class="mono" x="30" y="232" font-size="12" fill="#ffd166">XP → SPECIALIST</text>
  <rect x="30" y="242" width="250" height="14" rx="7" fill="#1f1640"/>
  <rect class="fill" x="30" y="242" width="110" height="14" rx="7" fill="url(#xp)" style="animation-delay:.2s"/>

  <!-- HP / MP -->
  <text class="mono" x="30" y="288" font-size="12" fill="#ff4fa3">HP</text>
  <rect x="62" y="278" width="218" height="10" rx="5" fill="#1f1640"/>
  <rect class="fill" x="62" y="278" width="200" height="10" rx="5" fill="#ff4fa3" style="animation-delay:.5s"/>
  <text class="mono" x="30" y="314" font-size="12" fill="#29e7ff">MP</text>
  <rect x="62" y="304" width="218" height="10" rx="5" fill="#1f1640"/>
  <rect class="fill" x="62" y="304" width="190" height="10" rx="5" fill="#29e7ff" style="animation-delay:.7s"/>
  <text class="mono" x="30" y="340" font-size="11" fill="#7d8590">(se recarga con cafe ☕)</text>

  <line x1="320" y1="70" x2="320" y2="330" stroke="#a855f7" stroke-opacity=".35"/>

  <!-- Stats -->
  <g class="mono" font-size="13" fill="#e6edf3" font-weight="700">
    <text x="345" y="90">ALGORITMOS</text>
    <text x="345" y="132">ESTRUCTURAS DATOS</text>
    <text x="345" y="174">MATEMATICAS</text>
    <text x="345" y="216">GEOMETRIA</text>
    <text x="345" y="258">ENSENAR</text>
    <text x="345" y="300">CONSTANCIA</text>
  </g>

  <g fill="#1f1640">
    <rect x="520" y="78"  width="300" height="14" rx="7"/>
    <rect x="520" y="120" width="300" height="14" rx="7"/>
    <rect x="520" y="162" width="300" height="14" rx="7"/>
    <rect x="520" y="204" width="300" height="14" rx="7"/>
    <rect x="520" y="246" width="300" height="14" rx="7"/>
    <rect x="520" y="288" width="300" height="14" rx="7"/>
  </g>

  <g fill="url(#bar)">
    <rect class="fill" x="520" y="78"  width="165" height="14" rx="7" style="animation-delay:.3s"/>
    <rect class="fill" x="520" y="120" width="150" height="14" rx="7" style="animation-delay:.5s"/>
    <rect class="fill" x="520" y="162" width="210" height="14" rx="7" style="animation-delay:.7s"/>
    <rect class="fill" x="520" y="204" width="135" height="14" rx="7" style="animation-delay:.9s"/>
    <rect class="fill" x="520" y="246" width="255" height="14" rx="7" style="animation-delay:1.1s"/>
    <rect class="fill" x="520" y="288" width="225" height="14" rx="7" style="animation-delay:1.3s"/>
  </g>

  <g class="mono" font-size="13" fill="#ffd166" font-weight="700">
    <text x="835" y="90">55</text>
    <text x="835" y="132">50</text>
    <text x="835" y="174">70</text>
    <text x="835" y="216">45</text>
    <text x="835" y="258">85</text>
    <text x="835" y="300">75</text>
  </g>

  <text class="mono" x="450" y="360" text-anchor="middle" font-size="12" letter-spacing="2" fill="#ff4fa3">HABILIDAD ESPECIAL: explicar cosas dificiles de forma facil<tspan class="blink"> ▮</tspan></text>
</svg>
