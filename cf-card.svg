<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" role="img" aria-label="Codeforces: Hery, Pupil, rating —">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1f"/>
      <stop offset="1" stop-color="#171040"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .sans { font-family: 'Impact', 'Trebuchet MS', 'Segoe UI', sans-serif; }
    .fill { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.6s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
  <rect width="900" height="190" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="188" rx="13" fill="none" stroke="#22c55e" stroke-opacity=".6" stroke-width="2"/>

  <text class="mono" x="30" y="36" font-size="14" font-weight="700" letter-spacing="3" fill="#60a5fa">▌CODEFORCES · SINCRONIZADO</text>
  <text class="mono" x="870" y="36" text-anchor="end" font-size="12" letter-spacing="2" fill="#6b7280">GRADO 3</text>
  <line x1="30" y1="50" x2="870" y2="50" stroke="#7c3aed" stroke-opacity=".45"/>

  <text class="sans" x="30" y="98" font-size="40" letter-spacing="4" fill="#22c55e">Hery</text>
  <text class="mono" x="30" y="122" font-size="15" font-weight="700" fill="#22c55e">PUPIL</text>

  <text class="mono" x="620" y="72" font-size="12" letter-spacing="2" fill="#9ca3af">RATING</text>
  <text class="sans pulse" x="620" y="128" font-size="48" fill="#ffffff">—</text>
  <text class="mono" x="780" y="72" font-size="12" letter-spacing="2" fill="#9ca3af">MAXIMO</text>
  <text class="sans" x="780" y="124" font-size="34" fill="#fbbf24">—</text>
  <text class="mono" x="780" y="142" font-size="11" fill="#9ca3af">Pupil</text>

  <rect x="30" y="150" width="560" height="12" rx="6" fill="#1b1648"/>
  <rect class="fill" x="30" y="150" width="0.0" height="12" rx="6" fill="url(#bar)"/>
  <text class="mono" x="30" y="180" font-size="11" letter-spacing="1" fill="#a78bfa">SIGUIENTE: SPECIALIST</text>
</svg>
