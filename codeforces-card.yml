name: Actualizar tarjeta de Codeforces

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch:         # boton manual en la pestaña Actions
  push:
    paths:
      - ".github/scripts/cf_card.py"
      - ".github/workflows/codeforces-card.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar tarjeta
        env:
          CF_HANDLE: Hery
        run: python .github/scripts/cf_card.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cf-card.svg
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "chore: actualizar tarjeta de Codeforces"
            git push
          fi
