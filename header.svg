<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 300" width="100%" role="img" aria-label="HERY - Lv. Pupil - Competitive Programmer and Tutor">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0a24"/>
      <stop offset="0.55" stop-color="#2a0f55"/>
      <stop offset="1" stop-color="#6a1b7a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29e7ff"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <mask id="slits">
      <rect width="900" height="300" fill="#fff"/>
      <rect x="340" y="150" width="220" height="3" fill="#000"/>
      <rect x="340" y="164" width="220" height="5" fill="#000"/>
      <rect x="340" y="180" width="220" height="7" fill="#000"/>
      <rect x="340" y="198" width="220" height="9" fill="#000"/>
    </mask>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <path id="petal" d="M0 0 C 6 -7 15 -2 10 8 C 6 15 -3 10 0 0 Z"/>
  </defs>

  <style>
    .sans { font-family: 'Trebuchet MS', 'Segoe UI', Impact, sans-serif; }
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .fall { animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes fall {
      0%   { transform: translate(0, -30px) rotate(0deg); opacity: 0; }
      10%  { opacity: .95; }
      100% { transform: translate(140px, 330px) rotate(560deg); opacity: .5; }
    }
    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
    .blink { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .win { animation: tw 4s ease-in-out infinite; }
  </style>

  <!-- Cielo -->
  <rect width="900" height="300" rx="14" fill="url(#sky)"/>

  <!-- Estrellas -->
  <g fill="#fff">
    <circle class="tw" cx="60"  cy="40"  r="1.6" style="animation-delay:-.2s"/>
    <circle class="tw" cx="140" cy="90"  r="1.2" style="animation-delay:-1.4s"/>
    <circle class="tw" cx="230" cy="30"  r="1.8" style="animation-delay:-2.1s"/>
    <circle class="tw" cx="310" cy="70"  r="1.2" style="animation-delay:-.8s"/>
    <circle class="tw" cx="640" cy="40"  r="1.6" style="animation-delay:-1.9s"/>
    <circle class="tw" cx="720" cy="95"  r="1.2" style="animation-delay:-.5s"/>
    <circle class="tw" cx="800" cy="35"  r="1.8" style="animation-delay:-2.6s"/>
    <circle class="tw" cx="860" cy="80"  r="1.2" style="animation-delay:-1.1s"/>
    <circle class="tw" cx="530" cy="22"  r="1.2" style="animation-delay:-2.3s"/>
    <circle class="tw" cx="410" cy="26"  r="1.4" style="animation-delay:-.9s"/>
  </g>

  <!-- Sol synthwave -->
  <circle cx="450" cy="150" r="100" fill="url(#sun)" opacity=".75" mask="url(#slits)"/>

  <!-- Ciudad -->
  <g fill="#0a0618">
    <rect x="0"   y="236" width="60"  height="64"/>
    <rect x="60"  y="214" width="46"  height="86"/>
    <rect x="106" y="248" width="50"  height="52"/>
    <rect x="156" y="226" width="40"  height="74"/>
    <rect x="196" y="244" width="64"  height="56"/>
    <rect x="260" y="220" width="44"  height="80"/>
    <rect x="304" y="250" width="70"  height="50"/>
    <rect x="526" y="248" width="70"  height="52"/>
    <rect x="596" y="222" width="44"  height="78"/>
    <rect x="640" y="244" width="60"  height="56"/>
    <rect x="700" y="212" width="48"  height="88"/>
    <rect x="748" y="240" width="50"  height="60"/>
    <rect x="798" y="224" width="44"  height="76"/>
    <rect x="842" y="246" width="58"  height="54"/>
  </g>
  <g fill="#ffd166">
    <rect class="win" x="70"  y="224" width="5" height="5" style="animation-delay:-.4s"/>
    <rect class="win" x="86"  y="238" width="5" height="5" style="animation-delay:-2.2s"/>
    <rect class="win" x="168" y="236" width="5" height="5" style="animation-delay:-1.3s"/>
    <rect class="win" x="272" y="232" width="5" height="5" style="animation-delay:-3s"/>
    <rect class="win" x="608" y="234" width="5" height="5" style="animation-delay:-.9s"/>
    <rect class="win" x="712" y="224" width="5" height="5" style="animation-delay:-2.7s"/>
    <rect class="win" x="728" y="246" width="5" height="5" style="animation-delay:-1.7s"/>
    <rect class="win" x="810" y="236" width="5" height="5" style="animation-delay:-.1s"/>
  </g>

  <!-- Titulo con brillo -->
  <text class="sans glow" x="450" y="152" text-anchor="middle" font-size="104" font-weight="900" letter-spacing="16" fill="url(#title)" filter="url(#blur)">HERY</text>
  <text class="sans" x="450" y="152" text-anchor="middle" font-size="104" font-weight="900" letter-spacing="16" fill="url(#title)" stroke="#0f0a24" stroke-width="6" paint-order="stroke">HERY</text>

  <!-- Subtitulo -->
  <text class="mono" x="450" y="196" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="4" fill="#29e7ff" stroke="#0f0a24" stroke-width="4" paint-order="stroke">LV. PUPIL  ·  COMPETITIVE PROGRAMMER  ·  TUTOR</text>
  <text class="mono" x="450" y="228" text-anchor="middle" font-size="14" letter-spacing="3" fill="#ffd166" stroke="#0f0a24" stroke-width="3" paint-order="stroke">PRESS START<tspan class="blink"> ▮</tspan></text>

  <!-- Petalos de sakura -->
  <g fill="#ffb7d5">
    <g transform="translate(40,0)"  ><g class="fall" style="animation-duration:9s;animation-delay:-1s"><use href="#petal" xlink:href="#petal"/></g></g>
    <g transform="translate(130,0)" ><g class="fall" style="animation-duration:12s;animation-delay:-6s"><use href="#petal" xlink:href="#petal" transform="scale(1.3)"/></g></g>
    <g transform="translate(220,0)" ><g class="fall" style="animation-duration:10s;animation-delay:-3s"><use href="#petal" xlink:href="#petal" transform="scale(.9)"/></g></g>
    <g transform="translate(330,0)" ><g class="fall" style="animation-duration:13s;animation-delay:-9s"><use href="#petal" xlink:href="#petal" transform="scale(1.1)"/></g></g>
    <g transform="translate(450,0)" ><g class="fall" style="animation-duration:11s;animation-delay:-4s"><use href="#petal" xlink:href="#petal" transform="scale(1.4)"/></g></g>
    <g transform="translate(560,0)" ><g class="fall" style="animation-duration:9.5s;animation-delay:-7s"><use href="#petal" xlink:href="#petal"/></g></g>
    <g transform="translate(650,0)" ><g class="fall" style="animation-duration:12.5s;animation-delay:-2s"><use href="#petal" xlink:href="#petal" transform="scale(1.2)"/></g></g>
    <g transform="translate(740,0)" ><g class="fall" style="animation-duration:10.5s;animation-delay:-8s"><use href="#petal" xlink:href="#petal" transform="scale(.8)"/></g></g>
    <g transform="translate(810,0)" ><g class="fall" style="animation-duration:14s;animation-delay:-5s"><use href="#petal" xlink:href="#petal" transform="scale(1.3)"/></g></g>
    <g transform="translate(870,0)" ><g class="fall" style="animation-duration:11.5s;animation-delay:-10s"><use href="#petal" xlink:href="#petal"/></g></g>
  </g>

  <rect x="1" y="1" width="898" height="298" rx="13" fill="none" stroke="#a855f7" stroke-opacity=".6" stroke-width="2"/>
</svg>
